<div class="search-box">
  <div class="input-container">
    <span class="icon">🔍</span>

    <input 
      type="text"
      placeholder="Buscá películas por género, año, actores, etc..."
      [value]="userInput()"
      (input)="onInputChange($event)"
      (keyup.enter)="sendPrompt()"
    />
    <div class="toggle-container">
</div>

    <button class="send-btn" (click)="sendPrompt()" [disabled]="loading()">
      Buscar
    </button>
  </div>

  @if (loading()) {
    <p class="loading-message">⏳ Buscando recomendaciones...</p>
  }

  
</div>
